services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zerotrace
      POSTGRES_PASSWORD: zerotrace
      POSTGRES_DB: zerotrace
    volumes:
      - zerotrace_pg:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerotrace -d zerotrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3020:3000"
    environment:
      DATABASE_URL: postgresql://zerotrace:zerotrace@db:5432/zerotrace
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://102.207.151.58:3020}
      CRON_SECRET: ${CRON_SECRET:-}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  zerotrace_pg:
