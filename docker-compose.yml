services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zerotrace
      POSTGRES_PASSWORD: zerotrace
      POSTGRES_DB: zerotrace
    ports:
      - "5436:5432"
    volumes:
      - zerotrace_pg:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  zerotrace_pg:
